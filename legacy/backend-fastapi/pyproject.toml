# ERP backend package metadata and dependency manifest.
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "erp-core"
version = "0.1.0"
description = "Anti-leakage ERP backend foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy[asyncio]>=2.0.32",
  "asyncpg>=0.29.0",
  "alembic>=1.13.2",
  "pydantic-settings>=2.4.0",
  "redis>=5.0.8",
  "celery>=5.4.0",
  "PyJWT>=2.9.0",
  "passlib[bcrypt]>=1.7.4",
  "prometheus-client>=0.21.0",
  "elasticsearch>=8.14.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.27.0",
  "aiosqlite>=0.20.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "monitoring*", "docs*", "alembic*"]
