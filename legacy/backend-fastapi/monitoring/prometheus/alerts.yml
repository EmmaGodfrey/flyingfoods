groups:
  - name: erp-week8-observability
    rules:
      - alert: ERPRepeatedEventHandlerFailures
        expr: sum(increase(erp_event_handler_failures_total[5m])) >= 3
        for: 2m
        labels:
          severity: warning
          service: erp-api
          route: oncall
        annotations:
          summary: Repeated inventory event-handler failures
          description: Event handlers have failed at least 3 times in 5m. Check handler logs and correlation IDs.

      - alert: ERPAuditQueryLatencyDegraded
        expr: histogram_quantile(0.95, sum(rate(erp_audit_query_latency_ms_bucket[5m])) by (le, role)) > 750
        for: 10m
        labels:
          severity: critical
          service: erp-api
          route: oncall
        annotations:
          summary: Audit query p95 latency degradation
          description: Audit log query p95 latency exceeded 750ms for 10m.

      - alert: ERPAuditQueryThroughputDrop
        expr: sum(rate(erp_audit_query_requests_total[15m])) < 0.02
        for: 15m
        labels:
          severity: warning
          service: erp-api
          route: oncall
        annotations:
          summary: Audit query throughput anomaly
          description: Audit query throughput is lower than expected for 15m.

      - alert: ERPAsyncPaymentReconcileFailures
        expr: sum(increase(erp_sales_payment_reconcile_async_failures_total[10m])) >= 1
        for: 2m
        labels:
          severity: warning
          service: erp-api
          route: oncall
        annotations:
          summary: Async payment reconciliation failures detected
          description: At least one async payment reconciliation job failed in 10m. Check job status payloads and provider references.

      - alert: ERPAsyncPaymentReconcileQueueLag
        expr: (sum(increase(erp_sales_payment_reconcile_async_enqueued_total[10m])) - sum(increase(erp_sales_payment_reconcile_async_started_total[10m]))) > 5
        for: 10m
        labels:
          severity: critical
          service: erp-api
          route: oncall
        annotations:
          summary: Async reconciliation queue lag
          description: Reconciliation enqueue volume exceeds started jobs by more than 5 over 10m.
