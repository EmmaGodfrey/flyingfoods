name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: erp
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp -d erp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -e .[dev]

      - name: Run pytest
        working-directory: backend
        env:
          DATABASE_URL: postgres://erp:erp@localhost:5432/erp
          REDIS_URL: redis://localhost:6379/0
          DJANGO_SECRET_KEY: ci-secret
          DJANGO_DEBUG: "False"
          DJANGO_ALLOWED_HOSTS: localhost
          DJANGO_SETTINGS_MODULE: config.settings.dev
        run: pytest

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests
        working-directory: frontend
        run: npm test --if-present

      - name: Build
        working-directory: frontend
        run: npm run build

  deploy-dev:
    name: Deploy dev
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/dev' &&
      vars.DEV_DEPLOY_ENABLED == 'true'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    environment: development
    concurrency:
      group: flyingfoods-development
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Configure deployment SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload release
        env:
          DEV_SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          DEV_SSH_USER: ${{ secrets.DEV_SSH_USER }}
          DEV_DEPLOY_PATH: ${{ secrets.DEV_DEPLOY_PATH }}
        run: |
          ssh "$DEV_SSH_USER@$DEV_SSH_HOST" "mkdir -p '$DEV_DEPLOY_PATH'"
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.env.dev' \
            --exclude '.claude/' \
            --exclude '.specify/' \
            ./ "$DEV_SSH_USER@$DEV_SSH_HOST:$DEV_DEPLOY_PATH/"

      - name: Rebuild and restart development instance
        env:
          DEV_SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          DEV_SSH_USER: ${{ secrets.DEV_SSH_USER }}
          DEV_DEPLOY_PATH: ${{ secrets.DEV_DEPLOY_PATH }}
        run: |
          ssh "$DEV_SSH_USER@$DEV_SSH_HOST" \
            "cd '$DEV_DEPLOY_PATH' &&
             test -f .env.dev &&
             docker compose -f docker-compose.deploy.yml up -d --build --remove-orphans &&
             docker compose -f docker-compose.deploy.yml ps"
